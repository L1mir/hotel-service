server:
  port: 8092
  servlet:
    context-path: /property-view

spring:
  application:
    name: hotel-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:hotels;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: true
